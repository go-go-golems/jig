[package]
name = "jig-compute"
version = "0.1.0"
edition = "2021"
description = "jigcad numeric core (mesh analyses, slicing, linear algebra) compiled to WebAssembly; no dependencies"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
