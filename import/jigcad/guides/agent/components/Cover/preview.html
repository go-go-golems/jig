<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Form Skate Agent</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-display); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .deep { fill: var(--ink); }
  .red { fill: var(--accent); }
  .tint { fill: var(--hair); }
  .mid { fill: var(--ink-2); }
  .cut { fill: var(--bg); }
  .sq { rx: var(--radius-0); }
  .words { position: absolute; left: calc(var(--space-16) * 2); bottom: calc(var(--space-16) * 2); max-width: 440px; }
  .name { margin: 0; font-size: 72px; line-height: 0.95; font-weight: 700; letter-spacing: -0.01em; color: var(--ink); }
  .tag { margin: var(--space-10) 0 0 2px; font-family: var(--font-ui); font-size: 13px; line-height: 18px; color: var(--ink-2); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      ink 208×240 visible, bled off the top and right edges (the deep slab) · hair 224×112 (the tint) · accent 80×56, the one hue the panel spends on what needs the person · ink-2 16×56 beside it · ≈ 27% of 960×288
  arrangement one tall ink slab with two satellites on a shared bottom line, space-16 above the edge, space-16 gutters
  pattern     the step rail, from "every step shows up as a collapsible block": seven eval summaries cut into the slab in bg, each a dot-step square and a bar of its first line, at a space-12 × 2 pitch; the fifth dot is accent, a step waiting for you
  scales      sides in space-8 / space-16 multiples; dots dot-step (7px); bars line-2 × 2 tall; pitch 24px; every corner radius-0
-->
<rect class="deep sq" x="272" y="-8" width="216" height="248" rx="0"/>
<rect class="tint sq" x="16" y="128" width="224" height="112" rx="0"/>
<rect class="red sq" x="160" y="72" width="80" height="56" rx="0"/>
<rect class="mid sq" x="136" y="72" width="16" height="56" rx="0"/>
<rect class="cut sq" x="296" y="28" width="7" height="7" rx="0"/><rect class="cut sq" x="312" y="30" width="120" height="4" rx="0"/>
<rect class="cut sq" x="296" y="52" width="7" height="7" rx="0"/><rect class="cut sq" x="312" y="54" width="88" height="4" rx="0"/>
<rect class="cut sq" x="296" y="76" width="7" height="7" rx="0"/><rect class="cut sq" x="312" y="78" width="144" height="4" rx="0"/>
<rect class="cut sq" x="296" y="100" width="7" height="7" rx="0"/><rect class="cut sq" x="312" y="102" width="104" height="4" rx="0"/>
<rect class="red sq" x="296" y="124" width="7" height="7" rx="0"/><rect class="cut sq" x="312" y="126" width="136" height="4" rx="0"/>
<rect class="cut sq" x="296" y="148" width="7" height="7" rx="0"/><rect class="cut sq" x="312" y="150" width="72" height="4" rx="0"/>
<rect class="cut sq" x="296" y="172" width="7" height="7" rx="0"/><rect class="cut sq" x="312" y="174" width="112" height="4" rx="0"/>
</svg>
</div>
<div class="words">
<h1 class="name">Form Skate<br>Agent</h1>
<p class="tag">One tool, every step shown, every edit revertible.</p>
</div>
</div>
</body>
</html>
