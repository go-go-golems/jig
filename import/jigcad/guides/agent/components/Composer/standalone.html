<!-- standalone copy of preview.html: opens offline; #light or #dark picks the theme -->
<!doctype html>
<html lang="en">
<head><script>(function(){var d=document.documentElement;function pick(){var h=location.hash.slice(1);return h==='dark'||h==='light'?h:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}d.setAttribute('data-theme',pick());addEventListener('hashchange',function(){d.setAttribute('data-theme',pick());});function size(){try{parent.postMessage({dsHeight:Math.ceil(d.scrollHeight)},'*');}catch(e){}}addEventListener('load',function(){size();setTimeout(size,400);if(window.ResizeObserver)new ResizeObserver(size).observe(d);});})();</script><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Composer — preview</title></head>
<body>
<div style="display:flex;flex-direction:column;gap:12px">
<div class="composer">
  <textarea placeholder="Ask the agent: “make heelflips catch earlier”, “add a manual trick”, “why did that bail?”" aria-label="Message to the agent"></textarea>
  <div class="row"><span class="meta">Enter sends · Shift+Enter for a new line · steps run as they come</span>
    <button class="btn primary" disabled>Send</button></div>
</div>
<div class="composer">
  <textarea placeholder="Ask the agent: “make heelflips catch earlier”, “add a manual trick”, “why did that bail?”" aria-label="Message to the agent">Make heelflips catch earlier and show the catch time before and after</textarea>
  <div class="row"><span class="meta">Enter sends · Shift+Enter for a new line · you approve each step</span>
    <button class="btn primary">Send</button></div>
</div>
<div class="composer">
  <textarea placeholder="Ask the agent: “make heelflips catch earlier”, “add a manual trick”, “why did that bail?”" aria-label="Message to the agent"></textarea>
  <div class="row"><span class="meta">Enter sends · Shift+Enter for a new line · read-only</span>
    <button class="btn danger">Stop</button></div>
</div>
</div>
</body>
</html>
