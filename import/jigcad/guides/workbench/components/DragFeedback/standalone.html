<!-- standalone copy of preview.html: opens offline; #light or #dark picks the theme -->
<!doctype html>
<html lang="en">
<head><script>(function(){var d=document.documentElement;function pick(){var h=location.hash.slice(1);return h==='dark'||h==='light'?h:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}d.setAttribute('data-theme',pick());addEventListener('hashchange',function(){d.setAttribute('data-theme',pick());});function size(){try{parent.postMessage({dsHeight:Math.ceil(d.scrollHeight)},'*');}catch(e){}}addEventListener('load',function(){size();setTimeout(size,400);if(window.ResizeObserver)new ResizeObserver(size).observe(d);});})();</script><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>DragFeedback</title>
<style>.box{position:absolute;left:12px;top:12px;width:560px;height:200px;border:1px solid var(--hair)}.strip{position:absolute;left:12px;right:12px;top:0;height:40px;border-bottom:1px solid var(--hair);display:flex}.strip span{display:flex;align-items:center;padding:0 12px;color:var(--ink-2);font-size:var(--fs-m)}</style></head>
<body>

<div class="box"><div class="strip"><span>Stage</span><span>Graph</span></div></div>
<div class="drop-hint" style="left:292px;top:53px;width:280px;height:159px"><span>split right</span></div>
<div class="drag-ghost" style="left:120px;top:150px">Traces <small>split right</small></div>
<div class="drop-hint marker" style="left:90px;top:19px;width:2px;height:28px"></div>
</body>
</html>
