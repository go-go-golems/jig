<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Toolbar</title>
<style>.wrap{margin:12px;border:1px solid var(--hair)}</style></head>
<body>

<div class="wrap">
  <div class="toolbar"><div class="seg sm" role="group" aria-label="Window"><button aria-pressed="false">2 s</button><button class="on" aria-pressed="true">5 s</button><button aria-pressed="false">10 s</button><button aria-pressed="false">20 s</button></div><button class="tog" aria-pressed="false" title="Stop scrolling (the simulation keeps running)">Freeze</button><input class="filter" placeholder="add a trace: filter signals and states" aria-label="Add a trace"></div>
  <div class="toolbar"><input class="filter" placeholder="filter" aria-label="Filter"><button class="tog" aria-pressed="false">Changed (0)</button><span class="lbl">Live: a change takes effect on the next step. Edit the code to change a default.</span></div>
  <div class="notes" style="flex:none"><div class="toolbar"><span class="ntitle"><span class="pcode">B-01</span> <b>Flatground</b> <span class="pcode">· Basics</span></span><span class="sp"></span><button class="tog" aria-pressed="false" title="Edit these notes (markdown, $math$, lab: links)">Edit</button></div></div>
  <div class="hint"><b>Click the stage</b><span>↑ push · ←→ carve · Space pop · J/L flick · I/K scoop · U wrap · drag to orbit · Shift-drag or right-drag to pan · wheel to zoom · double-click to square up</span></div>
</div>
</body>
</html>
