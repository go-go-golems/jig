<!-- standalone copy of preview.html: opens offline; #light or #dark picks the theme -->
<!doctype html>
<html lang="en">
<head><script>(function(){var d=document.documentElement;function pick(){var h=location.hash.slice(1);return h==='dark'||h==='light'?h:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}d.setAttribute('data-theme',pick());addEventListener('hashchange',function(){d.setAttribute('data-theme',pick());});function size(){try{parent.postMessage({dsHeight:Math.ceil(d.scrollHeight)},'*');}catch(e){}}addEventListener('load',function(){size();setTimeout(size,400);if(window.ResizeObserver)new ResizeObserver(size).observe(d);});})();</script><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Toast</title>
<style>.toasts{position:absolute;bottom:16px}</style></head>
<body>

<div class="toasts" aria-live="polite">
  <div class="toast">Back to the preset as published</div>
  <div class="toast">Saved as U-01</div>
  <div class="toast bad">no chapter 99</div>
</div>
</body>
</html>
