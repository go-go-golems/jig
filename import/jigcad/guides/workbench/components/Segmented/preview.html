<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Segmented</title>
<style>.demo{padding:16px;display:flex;flex-direction:column;gap:12px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.cap{color:var(--ink-2);font-size:var(--fs-xs);min-width:150px}</style></head>
<body>

<div class="demo">
  <div class="row"><span class="cap">view</span><div class="seg" role="group" aria-label="View"><button class="on" aria-pressed="true" title="Axonometric">Axo</button><button aria-pressed="false" title="Front elevation">Front</button><button aria-pressed="false" title="Side elevation">Side</button><button aria-pressed="false" title="Plan">Plan</button></div></div>
  <div class="row"><span class="cap">.sm · window</span><div class="seg sm" role="group" aria-label="Window"><button aria-pressed="false">2 s</button><button class="on" aria-pressed="true">5 s</button><button aria-pressed="false">10 s</button><button aria-pressed="false">20 s</button></div>
  <div class="seg sm dis" role="group" aria-label="Speed"><button aria-pressed="false">¼</button><button aria-pressed="false">½</button><button class="on" aria-pressed="true">1×</button></div><span class="cap">.dis</span></div>
</div>
</body>
</html>
