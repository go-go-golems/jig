<!-- standalone copy of preview.html: opens offline; #light or #dark picks the theme -->
<!doctype html>
<html lang="en">
<head><script>(function(){var d=document.documentElement;function pick(){var h=location.hash.slice(1);return h==='dark'||h==='light'?h:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}d.setAttribute('data-theme',pick());addEventListener('hashchange',function(){d.setAttribute('data-theme',pick());});function size(){try{parent.postMessage({dsHeight:Math.ceil(d.scrollHeight)},'*');}catch(e){}}addEventListener('load',function(){size();setTimeout(size,400);if(window.ResizeObserver)new ResizeObserver(size).observe(d);});})();</script><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Field</title>
<style>.demo{padding:16px;display:flex;flex-direction:column;gap:12px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.cap{color:var(--ink-2);font-size:var(--fs-xs);min-width:150px}.toolbar{border:1px solid var(--rule)}</style></head>
<body>

<div class="demo">
  <div class="toolbar"><input class="filter" placeholder="filter lines" aria-label="Filter lines"><input class="filter" value="pop" aria-label="Filter"><input class="evsearch" placeholder="search" aria-label="Search events"><span class="lbl">Zoom</span><input type="range" min="0.25" max="4" step="0.05" value="1.3" aria-label="Zoom"><select aria-label="Frames"><option>every frame</option><option selected>every 2nd frame</option><option>every 4th frame</option></select></div>
  <div class="row"><span class="cap">.newfile (inside a menu)</span><div class="newfile" style="padding:0;min-width:320px"><input placeholder="new file, e.g. skate/grind.js" aria-label="New file"></div></div>
</div>
</body>
</html>
