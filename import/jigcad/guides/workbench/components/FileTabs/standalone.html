<!-- standalone copy of preview.html: opens offline; #light or #dark picks the theme -->
<!doctype html>
<html lang="en">
<head><script>(function(){var d=document.documentElement;function pick(){var h=location.hash.slice(1);return h==='dark'||h==='light'?h:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}d.setAttribute('data-theme',pick());addEventListener('hashchange',function(){d.setAttribute('data-theme',pick());});function size(){try{parent.postMessage({dsHeight:Math.ceil(d.scrollHeight)},'*');}catch(e){}}addEventListener('load',function(){size();setTimeout(size,400);if(window.ResizeObserver)new ResizeObserver(size).observe(d);});})();</script><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>FileTabs</title>
<style>.wrap{margin:12px;border:1px solid var(--hair)}</style></head>
<body>

<div class="wrap codeview"><div class="toolbar filebar">
  <div class="filetabs">
    <span class="ftab"><button>main.js</button><button class="x" aria-label="close main.js">×</button></span>
    <span class="ftab on"><button>skate/motors.js •</button><button class="x" aria-label="close skate/motors.js">×</button></span>
    <span class="ftab"><button>skate/recognizer.js</button><button class="x" aria-label="close skate/recognizer.js">×</button></span>
  </div>
  <span class="sp"></span>
  <div class="rel"><button class="btn">Files ▾</button></div>
  <button class="btn primary">Run <kbd>⌘↵</kbd></button>
</div></div>
</body>
</html>
