<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>FileTabs</title>
<style>.wrap{margin:12px;border:1px solid var(--hair)}</style></head>
<body>

<div class="wrap codeview"><div class="toolbar filebar">
  <div class="filetabs">
    <span class="ftab"><button>main.js</button><button class="x" aria-label="close main.js">×</button></span>
    <span class="ftab on"><button>skate/motors.js •</button><button class="x" aria-label="close skate/motors.js">×</button></span>
    <span class="ftab"><button>skate/recognizer.js</button><button class="x" aria-label="close skate/recognizer.js">×</button></span>
  </div>
  <span class="sp"></span>
  <div class="rel"><button class="btn">Files ▾</button></div>
  <button class="btn primary">Run <kbd>⌘↵</kbd></button>
</div></div>
</body>
</html>
