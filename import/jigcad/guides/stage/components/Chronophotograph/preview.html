<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chronophotograph</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
  body { background: var(--st-bg); color: var(--st-ink); }
  .row { display: grid; gap: 0; }
  .row > figure { margin: 0; min-width: 0; border-left: 1px solid var(--st-grid); }
  .row > figure:first-child { border-left: 0; }
  canvas { display: block; width: 100%; }
  figcaption, .cap { font: 500 10px/1.45 var(--font-plex); color: var(--st-muted); padding: 2px 10px 8px; }
  figcaption b, .cap b { color: var(--st-ink); font-weight: 600; }
  
</style>
</head>
<body>
<canvas id="c" style="height:250px"></canvas>
<p class="cap"><b>D-03's chronophotograph</b> a stick figure every 0.083 s from the hips, feet and deck, opacity 0.25 → 1; the hips' path dashed. Example motion.</p>
<script>
  var S = window.FormSkateStage, Q = S.Q, V = S.V;
  function boot(paint) { paint(); S.onTheme(paint); addEventListener('resize', paint); if (document.fonts) document.fonts.ready.then(paint); }

  function smooth(x) { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }
  var s = [];
  for (var i = 0; i < 53; i++) {
    var t = 2.225 + i / 60, x = -1.4 + 2.94 * (t - 2.225), air = t >= 2.525 && t <= 3.008;
    var yd = !air ? 0.088 : t < 2.783 ? 0.496 - (0.496 - 0.107) * Math.pow((t - 2.783) / 0.258, 2) : 0.496 - (0.496 - 0.088) * Math.pow((t - 2.783) / 0.225, 2);
    var crouch = t < 2.525 ? 0.18 * smooth((t - 2.225) / 0.3) : 0;
    var yh = !air ? 1.03 - crouch : 0.775 + 2.36 * (t - 2.525) - 4.905 * Math.pow(t - 2.525, 2);
    var dq = Q.x(2 * Math.PI * 0.988 * smooth((t - 2.642) / 0.3)), dk = { p: [x, yd, 0], q: dq };
    s.push({ t: t, hip: [x, yh, 0], ff: [x + 0.13, Math.max(yd + 0.03, yd + 0.03), 0.02], rf: [x - 0.3, yd + 0.03, -0.02], deck: dk });
  }
  boot(function () { S.sheet(document.getElementById('c'), { view: 'front', scale: 120, target: [0.25, 0.7, 0], overlays: ['trail'] }).draw(function (g) { g.layer = 'overlay'; S.drawChrono(g, s, 0.08); }); });
</script>
</body>
</html>
