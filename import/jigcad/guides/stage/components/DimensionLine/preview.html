<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DimensionLine</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
  body { background: var(--st-bg); color: var(--st-ink); }
  .row { display: grid; gap: 0; }
  .row > figure { margin: 0; min-width: 0; border-left: 1px solid var(--st-grid); }
  .row > figure:first-child { border-left: 0; }
  canvas { display: block; width: 100%; }
  figcaption, .cap { font: 500 10px/1.45 var(--font-plex); color: var(--st-muted); padding: 2px 10px 8px; }
  figcaption b, .cap b { color: var(--st-ink); font-weight: 600; }
  
</style>
</head>
<body>
<canvas id="c" style="height:250px"></canvas>
<p class="cap"><b>Floor dimensions</b> the last four tricks, take-off to landing, 0.45 m offset; older ones fainter (0.35 + 0.65 (i + 1)/n); landed in st-blue, a bail in st-rec.</p>
<script>
  var S = window.FormSkateStage, Q = S.Q, V = S.V;
  function boot(paint) { paint(); S.onTheme(paint); addEventListener('resize', paint); if (document.fonts) document.fonts.ready.then(paint); }

  var T = [['OLLIE', 1.21, 0.31, true], ['POP SHOVE-IT', 1.38, 0.36, true], ['HEELFLIP · BAIL', 1.02, 0.33, false], ['KICKFLIP', 1.62, 0.42, true]];
  boot(function () {
    S.sheet(document.getElementById('c'), { view: 'plan', scale: 100, target: [0.1, 0, 0.7] }).draw(function (g) {
      g.layer = 'floor'; g.grid({ minor: 0.5, major: 2, extent: 6 });
      T.forEach(function (d, i) { var z = i * 0.62 - 0.55, a = [-0.8, 0, z], b = [-0.8 + d[1], 0, z]; g.dimension(a, b, d[0] + ' · ' + d[1].toFixed(2) + ' m · ' + d[2].toFixed(2) + ' s', { offset: 0.45, alpha: 0.35 + 0.65 * (i + 1) / T.length, tone: d[3] ? 'blue' : 'accent' }); });
    }, { scaleBar: true });
  });
</script>
</body>
</html>
