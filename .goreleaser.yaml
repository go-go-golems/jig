version: 2
project_name: jigcad

# The binary embeds the workbench (import/jigcad/dist, -tags embed), so the web build runs first. It needs Node 24
# and npm (esbuild goes to .bin/), and Rust with wasm32-unknown-unknown for jig-compute (without it the workbench
# falls back to its JavaScript implementations).
before:
  hooks:
    - go mod tidy
    - make web

builds:
  - id: jigcad
    main: ./cmd/jigcad
    binary: jigcad
    env:
      - CGO_ENABLED=0
    flags:
      - -tags=embed
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: jigcad
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - import/jigcad/BUILD.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

# Publishing (GitHub release from CI, Homebrew tap, signing, deb/rpm) is not configured yet: it needs the Vault
# release roles described in ttmp/…/JIG-007-GO-PLUMBING design doc §5. A tag push builds nothing until then.
release:
  disable: true

